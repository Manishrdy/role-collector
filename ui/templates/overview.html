{% extends "base.html" %}
{% block title %}Overview · Role Collector{% endblock %}
{% block content %}
<h1 class="page-title">Overview</h1>
<p class="page-sub">Pipeline state at a glance. DB: <code id="db-path" class="mono">…</code></p>

<div id="metrics" class="metrics">
  <div class="loading">Loading…</div>
</div>

<div class="card">
  <div class="card-title">Latest discoveries</div>
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr>
          <th>ID</th>
          <th>Company</th>
          <th>Title</th>
          <th>Location</th>
          <th>ATS</th>
          <th>Dedup</th>
          <th>First seen</th>
        </tr>
      </thead>
      <tbody id="latest-body">
        <tr><td colspan="7" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
