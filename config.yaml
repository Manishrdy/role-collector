# Job Sourcing Agent — user-editable config.
# See design_plan.md §24 for field reference.

agent:
  name: local_job_sourcing_agent
  mode: mvp
  dry_run: false

llm:
  provider: ollama
  model: qwen3:8b
  temperature: 0.0
  max_context_chars_per_page: 12000
  request_timeout_seconds: 90
  # Extractions below this confidence land in `jobs` with needs_review=1.
  low_confidence_threshold: 0.5

search:
  # Time windows the agent will iterate through per run.
  time_windows:
    - past_24h
    - past_48h
  # EDIT ME: roles you want to search for.
  roles:
    - software engineer
    - backend engineer
    - full stack engineer
    - founding engineer
  # EDIT ME: locations you want to target.
  locations:
    - remote
    - United States
    - San Francisco
    - New York
    - Los Angeles
    - San Diego
  max_queries_per_run: 20
  max_results_per_query: 10

sources:
  # ATS API discovery — hits Lever/Greenhouse/Ashby public board APIs
  # directly for every slug below. Runs BEFORE Google search so Google
  # becomes a long-tail fallback rather than the primary source.
  ats_api_discovery:
    enabled: true
    max_jobs_per_slug: 20
    seeds:
      lever:
        - spotify
        - palantir
        - mux
        - kraken
        - ramp
        - notion
        - figma
        - linear
        - vercel
      greenhouse:
        - figma
        - openai
        - airbnb
        - stripe
        - anthropic
        - retool
        - asana
        - databricks
        - vercel
        - loom
      ashby:
        - openai
        - anthropic
        - mercury
        - ramp
        - vanta
        - linear
        - replit
        - causal
        - posthog
  ats_google_search:
    enabled: true
    # Stop the channel after N successful queries instead of waiting for
    # Google to block us. Set 0 to disable.
    max_queries_before_self_stop: 10
    domains:
      - jobs.ashbyhq.com
      - jobs.lever.co
      - job-boards.greenhouse.io
      - boards.greenhouse.io
      - myworkdayjobs.com
      - wd1.myworkdaysite.com
      - wd5.myworkdaysite.com
      - jobs.smartrecruiters.com
  funding_discovery:
    enabled: true
    aggregators:
      hackernews: true
      techcrunch: true
      google: false  # off by default — turn on for deeper coverage at the cost of a nodriver session
    resolvers:
      enabled: true
      google_fallback: false  # off by default — nodriver session for name->website lookups
      playwright_fallback: true  # escalate per-URL on 403 / JS shells (lazy-init)
      max_companies_per_run: 20
    watchlist:
      max_jobs_per_company: 20  # cap board enumeration so one big board doesn't flood the queue
      repoll_after_hours: 6.0  # skip companies polled within this window; 0 = always re-poll
  linkedin_public_search:
    enabled: true
    login_allowed: false  # MUST stay false — public search only, never authenticated
    min_delay_per_post_seconds: 30.0
    max_delay_per_post_seconds: 60.0
    max_results_per_query: 5
    stop_on_captcha: true

browser:
  headless: false
  dedicated_profile_path: ./browser_profiles/job_agent
  downloads_allowed: false
  min_delay_seconds: 5
  max_delay_seconds: 20

limits:
  max_pages_per_domain_per_run: 5
  max_total_pages_per_run: 100
  stop_on_captcha: true
  stop_on_login_page: true
  # Tuned 2026-05-12: ATS API discovery now produces ~300 jobs without
  # Google, so Google search is just the long-tail fallback. 30-90s jitter
  # is "polite scraper" — Google will let 6-10 queries through before
  # blocking, which is plenty when combined with the API discovery layer.
  min_delay_between_searches_seconds: 30
  max_delay_between_searches_seconds: 90

dedupe:
  duplicate_threshold: 0.92
  possible_duplicate_threshold: 0.80
  weights:
    company: 0.30
    title: 0.25
    description: 0.30
    location: 0.10
    skills: 0.05

storage:
  sqlite_path: ./data/jobs.db

tracing:
  langfuse_enabled: true
  redact_pii: true
  log_raw_page_text: false
  log_resume_text: false

agent_loop:
  enabled: true
  react_enabled: true
  react_llm_enabled: false
  react_llm_sample_rate: 1.0
  react_max_steps: 24
  intelligence_llm_enabled: false
  cycle_reflection_llm_enabled: false
  cycle_sleep_hours: 4.0
  batch_min_jobs: 5
  batch_max_jobs: 10
  max_cycle_runtime_minutes: 90
  max_pages_per_cycle: 150
  max_google_queries_per_cycle: 10
  backoff_on_block_hours: 6.0
  fatal_retry_sleep_minutes: 15.0
  memory_markdown_enabled: true
  cadence:
    ats_api_hours: 4.0
    google_hours: 4.0
    funding_hours: 8.0
    watchlist_hours: 4.0
    linkedin_hours: 8.0

# Domain allowlist for the URL safety layer. Verified company domains
# (resolved at runtime by the career-page resolver) get added dynamically.
allowlist_domains:
  - google.com
  - www.google.com
  - jobs.ashbyhq.com
  - jobs.lever.co
  - job-boards.greenhouse.io
  - boards.greenhouse.io
  - myworkdayjobs.com
  - wd1.myworkdaysite.com
  - wd5.myworkdaysite.com
  - jobs.smartrecruiters.com
  - ycombinator.com
  - www.ycombinator.com
  - wellfound.com
  - linkedin.com
  - www.linkedin.com
  - techcrunch.com
  - www.techcrunch.com
